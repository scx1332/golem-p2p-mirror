[package]
name = "golem-p2p-cli"
description = "golem-p2p CLI: run a directory, listen, send, probe, bench; test client of the network test harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "golem-p2p"
path = "src/main.rs"

[dependencies]
golem-p2p = { workspace = true, features = ["directory-server", "http-directory"] }
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
# The net report (UDP reachability, public address, NAT mapping, relay
# latencies) is behind iroh's `unstable-net-report` feature. iroh is pinned
# to an exact version in the workspace, so this API cannot change under us.
iroh = { workspace = true, features = ["unstable-net-report"] }
iroh-relay.workspace = true
n0-future = "0.3"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
tokio = { workspace = true, features = ["process", "io-util"] }
hex.workspace = true
pem = "3"
serde_json = "1"
tracing-subscriber.workspace = true
