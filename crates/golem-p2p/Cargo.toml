[package]
name = "golem-p2p"
description = "Peer-to-peer communication between yagna nodes over iroh, with Ethereum identities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iroh.workspace = true
k256.workspace = true
sha2.workspace = true
sha3.workspace = true
postcard.workspace = true
serde.workspace = true
rand.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
hex.workspace = true
url.workspace = true
n0-future = "0.3"
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
axum = { workspace = true, optional = true, features = ["tokio", "http1"] }

[features]
default = ["http-directory"]
## HTTP client for the record directory.
http-directory = ["dep:reqwest"]
## HTTP record directory server.
directory-server = ["dep:axum", "tokio/net"]

[dev-dependencies]
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing-subscriber.workspace = true
rustls-pki-types = "1"
url.workspace = true
axum = { workspace = true, features = ["tokio", "http1"] }
golem-p2p = { path = ".", features = ["directory-server"] }
