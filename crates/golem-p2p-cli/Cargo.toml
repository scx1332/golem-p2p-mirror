[package]
name = "golem-p2p-cli"
description = "golem-p2p CLI: run a directory, listen, send, probe; test client of the network test harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "golem-p2p"
path = "src/main.rs"

[dependencies]
golem-p2p = { workspace = true, features = ["directory-server", "http-directory"] }
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
iroh-relay.workspace = true
n0-future = "0.3"
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
tokio = { workspace = true, features = ["process", "io-util"] }
hex.workspace = true
pem = "3"
serde_json = "1"
tracing-subscriber.workspace = true
